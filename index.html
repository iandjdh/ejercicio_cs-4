<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planes de Suscripción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary-subtle py-5">
  <div class="container">
    <div class="row g-4 align-items-center justify-content-center">
      <div class="col-12 col-md-4">
        <div class="card bg-light text-center shadow-sm border-0">
          <div class="card-body py-4">
            <h3 class="card-title fw-bold">Básico</h3>
            <p class="display-4 fw-bold my-3">$19</p>
            <button class="btn btn-warning fw-bold text-dark w-100">Elegir</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card bg-primary text-white text-center shadow-lg border-0">
          <div class="card-body py-5">
            <h3 class="card-title fw-bold">Pro VIP</h3>
            <p class="display-4 fw-bold my-3">$49</p>
            <button class="btn btn-warning fw-bold text-dark w-100">Elegir</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card bg-dark text-white text-center shadow-sm border-0">
          <div class="card-body py-4">
            <h3 class="card-title fw-bold">Enterprise</h3>
            <p class="display-4 fw-bold my-3">$99</p>
            <button class="btn btn-warning fw-bold text-dark w-100">Elegir</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
